# Configuração do portal (sem segredos; o secrets.toml é gerado na subida do container)
[server]
headless = true
address = "0.0.0.0"
port = 8501
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
# Erros não expõem stack trace nem detalhes internos ao navegador
showErrorDetails = "none"
toolbarMode = "viewer"
